<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap');

:root{
  --ink:#5b3a45;
  --ink-soft:#7a5563;
  --cream:#fff6f1;
  --pink:#ff89a0;
  --pink-deep:#e1607b;
  --peach:#ffd9b3;
  --mint:#bfeae0;
  --scrim-top: rgba(60,20,35,.35);
  --scrim-bot: rgba(45,15,28,.72);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  min-height:100vh;
  font-family:'Quicksand', sans-serif;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow-x:hidden;
}

/* ---------- BACKGROUND PHOTO LAYER ---------- */
#bg-layer{
  position:fixed;
  inset:0;
  z-index:0;
  background-size:cover;
  background-position:top center;
  transition:background-image .6s ease;
}
#bg-layer.no-photo{
  background-image:
    radial-gradient(circle at 25% 15%, rgba(255,217,179,.55), transparent 45%),
    radial-gradient(circle at 80% 85%, rgba(191,234,224,.35), transparent 50%),
    linear-gradient(135deg, #ffb6c8 0%, #ff8fa3 35%, #e1607b 70%, #b8455f 100%);
}
#bg-layer::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, var(--scrim-top) 0%, rgba(40,15,25,.2) 35%, var(--scrim-bot) 100%);
}

.no-photo-hint{
  position:absolute;
  inset:0;
  z-index:1;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.6rem;
  pointer-events:none;
  text-align:center;
}
.no-photo-hint .big-heart{
  font-size:3rem;
  animation:beat 1.6s ease-in-out infinite;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
}
.no-photo-hint span.label{
  font-family:'Quicksand', sans-serif;
  font-weight:600;
  letter-spacing:.04em;
  color:rgba(255,246,241,.85);
  background:rgba(0,0,0,.18);
  padding:.5rem 1.1rem;
  border-radius:999px;
  font-size:.85rem;
}
#bg-layer.no-photo ~ .no-photo-hint{display:flex;}

/* ---------- FLOATING PARTICLES (hearts, bunnies, unicorns) ---------- */
#hearts-bg{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}
.heart-particle{
  position:absolute;
  bottom:-10%;
  font-size:1.2rem;
  opacity:.85;
  will-change:transform, opacity;
  animation-name:floatUp;
  animation-timing-function:ease-in;
  animation-fill-mode:forwards;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.15));
}
@keyframes floatUp{
  0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
  10%{ opacity:.9; }
  100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(25deg); opacity:0; }
}

@keyframes beat{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.12); }
}

/* ---------- STAGE / LETTER ---------- */
.stage{
  position:relative;
  z-index:3;
  width:100%;
  max-width:600px;
  margin:6vh 1.25rem;
}

.letter-wrap{
  position:relative;
  animation:dropIn .8s cubic-bezier(.2,.9,.25,1.1) both;
}
@keyframes dropIn{
  from{ opacity:0; transform:translateY(-24px) rotate(-3deg) scale(.96); }
  to{ opacity:1; transform:translateY(0) rotate(-1deg) scale(1); }
}

.letter{
  background:rgba(255,246,241,.7);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-radius:22px;
  padding:2.8rem 2.4rem 2.2rem;
  box-shadow:
    0 25px 50px -18px rgba(60,20,35,.55),
    0 0 0 3px rgba(255,255,255,.35) inset;
  position:relative;
  animation:sway 7s ease-in-out infinite alternate;
  transform-origin:center 110%;
}
.letter-wrap:hover .letter{ animation-play-state:paused; }
@keyframes sway{
  from{ transform:rotate(-1.1deg); }
  to{ transform:rotate(1.1deg); }
}

/* washi tape */
.tape{
  position:absolute;
  width:88px;
  height:30px;
  opacity:.9;
  z-index:4;
  box-shadow:0 3px 6px rgba(0,0,0,.15);
}
.tape.left{
  top:-14px; left:22px;
  background:repeating-linear-gradient(45deg, var(--peach), var(--peach) 8px, #fff0dc 8px, #fff0dc 16px);
  transform:rotate(-8deg);
}
.tape.right{
  top:-12px; right:18px;
  background:repeating-linear-gradient(45deg, var(--mint), var(--mint) 8px, #eafaf5 8px, #eafaf5 16px);
  transform:rotate(7deg);
}

/* heart seal */
.seal{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  width:46px;
  height:46px;
  z-index:5;
  animation:beat 1.8s ease-in-out infinite;
  filter:drop-shadow(0 6px 8px rgba(60,20,35,.35));
}
.seal svg{ width:100%; height:100%; }
.seal-initials{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:4px;
  font-family:'Baloo 2', sans-serif;
  font-weight:600;
  font-size:.62rem;
  color:#fff;
  letter-spacing:.02em;
}

.eyebrow{
  font-family:'Quicksand', sans-serif;
  font-weight:600;
  font-size:.78rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--pink-deep);
  text-align:center;
  margin:.6rem 0 .3rem;
}

.dateline{
  text-align:center;
  font-family:'Quicksand', sans-serif;
  font-weight:500;
  font-size:.85rem;
  color:var(--ink-soft);
  margin-bottom:1.1rem;
}

h1{
  font-family:'Baloo 2', sans-serif;
  font-weight:700;
  font-size:1.85rem;
  line-height:1.2;
  color:var(--pink-deep);
  text-align:center;
  margin-bottom:.4rem;
}
.squiggle{
  display:block;
  width:110px;
  height:14px;
  margin:0 auto 1.6rem;
}

.body-copy p{
  font-family:'Caveat', cursive;
  font-weight:500;
  font-size:1.55rem;
  line-height:1.5;
  color:var(--ink);
  margin-bottom:.7rem;
  opacity:0;
  transform:translateY(8px);
  animation:paraIn .6s ease forwards;
}
@keyframes paraIn{ to{ opacity:1; transform:translateY(0); } }

.closing{
  margin-top:1.3rem;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:1rem;
}
.closing-text{
  font-family:'Caveat', cursive;
  font-size:1.3rem;
  color:var(--ink-soft);
}
.signature{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:2rem;
  color:var(--pink-deep);
}

.counter{
  text-align:center;
  margin-top:.7rem;
  font-family:'Quicksand', sans-serif;
  font-weight:500;
  font-size:.82rem;
  color:rgba(255,246,241,.85);
  letter-spacing:.03em;
}

@media (max-width:480px){
  .letter{ padding:2.3rem 1.5rem 1.9rem; }
  h1{ font-size:1.5rem; }
  .body-copy p{ font-size:1.35rem; }
  .tape{ width:70px; height:24px; }
}

@media (prefers-reduced-motion: reduce){
  .letter, .letter-wrap, .seal, .heart-particle{ animation:none !important; }
}

function pickIndex(){

}

function render(index){
  currentIndex = index;
  const m = MEMORIES[index];

  const bg = document.getElementById('bg-layer');

    para.style.animationDelay = (0.15 + i * 0.18) + 's';

  document.getElementById('counter').textContent =

const heartEmojis = ['💗','💖','💕','✨','💌','🌸','🐰','🐇','🦄'];
function spawnFloatingHeart(){

  el.className = 'heart-particle';

  el.style.left = startX + 'vw';
  el.style.fontSize = size + 'rem';
  el.style.setProperty('--drift', drift);
  el.style.animationDuration = duration + 's';
  document.getElementById('hearts-bg').appendChild(el);
  setTimeout(() => el.remove(), duration*1000 + 200);
}
